<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ 小魔丸連線 - 相片標價產生器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f8fb; color: #132c4d; margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; color: #132c4d; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; font-size: 20px;}
        
        .mode-switch { display: flex; background: #eef3f8; border-radius: 12px; padding: 5px; border: 1px solid #c6d4e1; width: 100%; max-width: 400px;}
        .mode-switch label { flex: 1; text-align: center; padding: 8px 10px; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 8px; color: #4a5568; transition: 0.3s; white-space: nowrap;}
        .mode-switch input[type="radio"] { display: none; }
        .mode-switch input[type="radio"]:checked + span { background: #132c4d; color: white; display: block; border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        .btn { background: #132c4d; color: white; border: none; padding: 12px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; flex: 1; min-width: 45%; text-align: center;}
        .btn:hover:not(:disabled) { opacity: 0.8; transform: translateY(-2px); }
        .btn:disabled { cursor: not-allowed; opacity: 0.6; }
        
        .btn-danger { background: #e53e3e; }
        .btn-success { background: #319795; }
        .btn-primary { background: #3182ce; }
        .btn-warning { background: #d69e2e; }
        .btn-secondary { background: #718096; }
        .btn-camera { background: #d53f8c; }
        
        .slider-container { display: flex; align-items: center; background: #eef3f8; padding: 12px 15px; border-radius: 12px; border: 1px solid #c6d4e1; margin-bottom: 15px; }
        .slider-container label { font-weight: bold; margin-right: 15px; font-size: 14px; white-space: nowrap; }
        input[type="range"] { flex: 1; cursor: pointer; accent-color: #132c4d; }
        
        /* 避免手機觸控時產生選取反白或預設選單 */
        .canvas-container { position: relative; border: 2px dashed #c6d4e1; border-radius: 16px; overflow: hidden; background: #fafafa; text-align: center; min-height: 300px; display: flex; justify-content: center; align-items: center; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;}
        canvas { max-width: 100%; height: auto; display: block; margin: 0 auto; cursor: crosshair; touch-action: none;}
        
        .tip { font-size: 13px; color: #718096; margin-top: 8px; line-height: 1.6; background: #fffbeb; padding: 12px 15px; border-left: 4px solid #f6e05e; border-radius: 8px; margin-bottom: 20px;}
        
        #toast {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: #132c4d; color: white; padding: 14px 24px;
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            font-weight: bold; font-size: 14px; display: none; z-index: 9999;
            white-space: nowrap; border-left: 5px solid #319795;
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(19, 44, 77, 0.85); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white; padding: 25px 20px 20px 20px; border-radius: 20px; max-width: 90%; max-height: 90%; overflow-y: auto; position: relative;
        }
        #image-export-modal .modal-content { text-align: center; }
        .modal-content img {
            max-width: 100%; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 15px; border: 1px solid #dbe4f0;
            -webkit-touch-callout: default !important;
            user-select: auto !important;
            pointer-events: auto !important;
        }
        .close-modal-btn {
            position: absolute; top: 12px; right: 18px; font-size: 28px; cursor: pointer; color: #a0aec0; font-weight: bold; line-height: 1; transition: 0.2s;
        }

        /* 匯率設定面板專用樣式 */
        .rate-group { margin-bottom: 12px; font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #f4f8fb; padding: 10px 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .rate-group label { font-weight: bold; color: #132c4d; white-space: nowrap; }
        .rate-group input { width: 70px; padding: 6px; border: 1px solid #cbd5e0; border-radius: 6px; text-align: center; font-size: 14px; }
        .rate-group span { color: #4a5568; font-size: 13px; }
    </style>
</head>
<body>

<div id="toast">✅ 同步成功！</div>

<!-- 圖片匯出 Modal -->
<div id="image-export-modal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-modal-btn" onclick="closeExportModal()">×</span>
        <h3 style="margin: 0; color: #132c4d; font-size: 18px;">👇 請長按下方圖片</h3>
        <p style="margin: 5px 0 0 0; font-size: 14px; color: #e53e3e; font-weight: bold;">選擇「儲存影像」或「拷貝」，即可傳送！</p>
        <img id="export-image-result" src="">
    </div>
</div>

<!-- ⚙️ 匯率區間設定 Modal -->
<div id="rate-settings-modal" class="modal-overlay" style="z-index: 10000;">
    <div class="modal-content" style="width: 420px;">
        <span class="close-modal-btn" onclick="toggleSettings()">×</span>
        <h3 style="margin: 0 0 20px 0; color: #132c4d; font-size: 18px; text-align: center;">⚙️ 匯率與區間設定</h3>
        
        <div class="rate-group">
            <label>區間 1</label>
            <span>日幣 ≤ <input type="number" id="r1-lim" value="1000"></span>
            <span>倍數 <input type="number" step="0.01" id="r1-rate" value="0.30"></span>
        </div>
        <div class="rate-group">
            <label>區間 2</label>
            <span>日幣 ≤ <input type="number" id="r2-lim" value="2000"></span>
            <span>倍數 <input type="number" step="0.01" id="r2-rate" value="0.27"></span>
        </div>
        <div class="rate-group">
            <label>區間 3</label>
            <span>日幣 ≤ <input type="number" id="r3-lim" value="5000"></span>
            <span>倍數 <input type="number" step="0.01" id="r3-rate" value="0.25"></span>
        </div>
        <div class="rate-group">
            <label>區間 4</label>
            <span>日幣 ≤ <input type="number" id="r4-lim" value="10000"></span>
            <span>倍數 <input type="number" step="0.01" id="r4-rate" value="0.24"></span>
        </div>
        <div class="rate-group">
            <label>區間 5</label>
            <span>超過區間 4</span>
            <span>倍數 <input type="number" step="0.01" id="r5-rate" value="0.23"></span>
        </div>
        
        <button class="btn btn-success" style="width: 100%; margin-top: 15px;" onclick="updateRates()">💾 儲存並重新計算畫面上標籤</button>
    </div>
</div>

<div class="container">
    <h2>
        ⚡ 相片標價產生器
        <div class="mode-switch">
            <label>
                <input type="radio" name="inputMode" value="click" checked onchange="changeMode(this.value)">
                <span>🖱️ 點擊小標籤</span>
            </label>
            <label>
                <input type="radio" name="inputMode" value="cover" onchange="changeMode(this.value)">
                <span>🔲 框選完美遮蓋</span>
            </label>
        </div>
    </h2>
    
    <div class="controls">
        <input type="file" id="image-loader" accept="image/*" style="display:none;">
        <button class="btn" onclick="document.getElementById('image-loader').click()">📁 相簿/檔案</button>

        <input type="file" id="camera-loader" accept="image/*" capture="environment" style="display:none;">
        <button class="btn btn-camera" onclick="document.getElementById('camera-loader').click()">📷 立即拍照</button>

        <button class="btn btn-secondary" onclick="toggleSettings()">⚙️ 匯率設定</button>
        <button class="btn btn-warning" onclick="copyImageToClipboard()">📤 複製/分享圖片</button>
        
        <button class="btn btn-primary" onclick="syncAllToBackend(this)" style="flex-basis: 100%;">☁️ 確認並同步到後台</button>
        
        <button class="btn btn-danger" onclick="undoLastBadge()">↩️ 復原</button>
        <button class="btn btn-success" onclick="downloadImage()">💾 下載圖片</button>
    </div>

    <div class="slider-container">
        <label for="size-slider">🔍 標籤大小：</label>
        <input type="range" id="size-slider" min="10" max="100" value="25" oninput="redrawCanvas()">
    </div>
    
    <div class="tip">
        <strong>📱 成功秘訣：</strong><br>
        1. 直播時請點擊 <b>【📷 立即拍照】</b>，手機將直接開啟相機，拍完自動載入！<br>
        2. 若使用 <b>【🖱️ 點擊小標籤】</b>，點擊畫面後只需輸入「日幣」，系統會<b>自動配發並補齊空缺代碼 (如 A001)</b>！<br>
        3. 點選 <b>【⚙️ 匯率設定】</b> 可自訂 5 個價格區間與對應乘數。<br>
        4. 點擊 <b>【☁️ 確認並同步到後台】</b> 將價格與照片寫入雲端並歸入連線區。
    </div>
    
    <div class="canvas-container" id="canvas-box">
        <p id="placeholder-text" style="color: #a0aec0; font-weight: bold; font-size: 16px;">請點選上方「載入/拍照」</p>
        <canvas id="photo-canvas" style="display:none;"></canvas>
    </div>
</div>

<script>
    // ⚠️ 確保這裡是您最新的 GAS 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxjeKY2LuG_z2NxPdYsnGf8OF8JIy6LqxpHuYTd-rjVZ8Wj5spuU07N8UsZzoCeWbuE/exec";
    const IMGBB_API_KEY = "047c09f72967af944b7686625c1c9680";

    const canvas = document.getElementById('photo-canvas');
    const ctx = canvas.getContext('2d');
    let img = new Image();
    let badgeHistory = []; 
    
    let currentMode = 'click'; 
    let isDragging = false, dragTargetIndex = -1, dragOffsetX = 0, dragOffsetY = 0;
    let isClick = true, startX = 0, startY = 0;
    let isDrawingBox = false, boxCurrentX = 0, boxCurrentY = 0;
    let lastTapTime = 0; 

    // ⭐ 全域變數：儲存雲端已經使用過的代碼，供自動配發運算使用
    let usedCodes = new Set();

    // 初始化 5 個匯率區間與倍率
    let exchangeRates = [
        { limit: 1000, rate: 0.30 },
        { limit: 2000, rate: 0.27 },
        { limit: 5000, rate: 0.25 },
        { limit: 10000, rate: 0.24 },
        { limit: Infinity, rate: 0.23 } 
    ];

    // ⭐ 網頁載入時自動抓取目前後台所有的商品代碼
    window.addEventListener('DOMContentLoaded', () => {
        showToast("⏳ 正在載入雲端代碼庫...");
        fetch(`${GAS_URL}?mode=getProducts&t=${new Date().getTime()}`)
            .then(res => res.json())
            .then(data => {
                data.forEach(p => {
                    if (p.id) usedCodes.add(String(p.id).toUpperCase());
                });
                showToast("✅ 雲端商品代碼已就緒！");
            })
            .catch(err => {
                console.error("載入代碼失敗:", err);
                showToast("⚠️ 代碼載入失敗，將從 A001 開始計算");
            });
    });

    // ⭐ 核心運算：自動取得下一個未使用的代碼（包含填補空缺）
    function getNextAvailableCode() {
        // 合併雲端已用的代碼與畫面上剛建立尚未同步的代碼
        let localUsed = new Set(usedCodes);
        badgeHistory.forEach(b => localUsed.add(String(b.code).toUpperCase()));

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for (let i = 0; i < letters.length; i++) {
            let letter = letters[i];
            for (let num = 1; num <= 999; num++) {
                // 產生如 A001, A015 的格式
                let code = letter + num.toString().padStart(3, '0');
                if (!localUsed.has(code)) {
                    return code;
                }
            }
        }
        return "Z999"; // 極端防呆
    }

    function toggleSettings() {
        let modal = document.getElementById('rate-settings-modal');
        modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function updateRates() {
        exchangeRates[0].limit = parseFloat(document.getElementById('r1-lim').value) || 1000;
        exchangeRates[0].rate = parseFloat(document.getElementById('r1-rate').value) || 0.3;
        exchangeRates[1].limit = parseFloat(document.getElementById('r2-lim').value) || 2000;
        exchangeRates[1].rate = parseFloat(document.getElementById('r2-rate').value) || 0.27;
        exchangeRates[2].limit = parseFloat(document.getElementById('r3-lim').value) || 5000;
        exchangeRates[2].rate = parseFloat(document.getElementById('r3-rate').value) || 0.25;
        exchangeRates[3].limit = parseFloat(document.getElementById('r4-lim').value) || 10000;
        exchangeRates[3].rate = parseFloat(document.getElementById('r4-rate').value) || 0.24;
        exchangeRates[4].rate = parseFloat(document.getElementById('r5-rate').value) || 0.23;

        badgeHistory.forEach(b => {
            b.twd = calculateTWD(b.jpy);
        });
        
        redrawCanvas();
        showToast("✅ 匯率設定已儲存並套用！");
        toggleSettings();
    }

    function changeMode(mode) { currentMode = mode; }

    function calculateTWD(jpy) {
        let val = parseFloat(jpy) || 0;
        let rate = exchangeRates[4].rate;
        
        for (let i = 0; i < 4; i++) {
            if (val <= exchangeRates[i].limit) {
                rate = exchangeRates[i].rate;
                break;
            }
        }
        return Math.ceil((val * rate) / 10) * 10;
    }

    function handleImageFile(e) {
        let reader = new FileReader();
        reader.onload = function(event) { 
            img.onload = function() { initCanvas(); }; 
            img.src = event.target.result; 
        }
        if(e.target.files[0]) {
            reader.readAsDataURL(e.target.files[0]);
        }
        e.target.value = '';
    }

    document.getElementById('image-loader').addEventListener('change', handleImageFile);
    document.getElementById('camera-loader').addEventListener('change', handleImageFile);

    document.addEventListener('paste', function(e) {
        let items = e.clipboardData.items;
        for (let item of items) {
            if (item.type.indexOf('image') !== -1) {
                let blob = item.getAsFile();
                let reader = new FileReader();
                reader.onload = function(event) { img.onload = function() { initCanvas(); }; img.src = event.target.result; };
                reader.readAsDataURL(blob);
                break;
            }
        }
    });

    function initCanvas() {
        const MAX_DIMENSION = 1440;
        let finalWidth = img.width;
        let finalHeight = img.height;

        if (finalWidth > MAX_DIMENSION || finalHeight > MAX_DIMENSION) {
            const ratio = Math.min(MAX_DIMENSION / finalWidth, MAX_DIMENSION / finalHeight);
            finalWidth = Math.round(finalWidth * ratio);
            finalHeight = Math.round(finalHeight * ratio);
        }

        canvas.width = finalWidth;
        canvas.height = finalHeight;
        document.getElementById('placeholder-text').style.display = 'none';
        canvas.style.display = 'block';
        badgeHistory = [];
        redrawCanvas();
    }

    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX;
        let clientY = e.clientY;
        
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
        } else if (e.changedTouches && e.changedTouches.length > 0) {
            clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY;
        }
        
        return { 
            x: (clientX - rect.left) * (canvas.width / rect.width), 
            y: (clientY - rect.top) * (canvas.height / rect.height) 
        };
    }

    function getBadgeHitbox(b) {
        let text = b.code ? `${b.code} NT$${b.twd}` : `NT$${b.twd}`;
        let subText = `(¥${b.jpy})`;
        let sf = document.getElementById('size-slider').value;
        let fontSize = Math.max(14, Math.round((canvas.width / 1000) * sf * 1.5));
        let subFontSize = Math.round(fontSize * 0.75);
        let fontStack = "'Comic Sans MS', 'Chalkboard SE', 'Fredoka One', 'Marker Felt', sans-serif";
        
        ctx.font = `bold ${fontSize}px ${fontStack}`;
        let textWidth = ctx.measureText(text).width;
        ctx.font = `bold ${subFontSize}px ${fontStack}`;
        let subWidth = ctx.measureText(subText).width;
        
        let paddingX = fontSize * 1.5;
        let paddingY = fontSize * 1.0;
        let contentWidth = Math.max(textWidth, subWidth) + paddingX * 2.2;
        let contentHeight = fontSize + subFontSize + paddingY * 1.8;
        
        let finalBoxWidth = Math.max(contentWidth, b.cw || 0);
        let finalBoxHeight = Math.max(contentHeight, b.ch || 0);

        return { left: b.x - finalBoxWidth / 2, right: b.x + finalBoxWidth / 2, top: b.y - finalBoxHeight / 2, bottom: b.y + finalBoxHeight / 2 };
    }

    // ⭐ 調整輸入解析：如果只有輸入數字，就配發 autoCode；如果輸入文字+數字，則視為客製化代碼
    function parseAndAddBadge(input, x, y, autoCode, cw = 0, ch = 0) {
        if (!input) return;
        let code = "", jpy = 0;
        input = input.trim().replace(/\s+/g, ' ');
        let parts = input.split(' ');
        
        // 若使用者輸入兩項以上 (例如 "B002 500")，則強制視為自訂代碼
        if (parts.length > 1 && isNaN(parseInt(parts[0]))) { 
            code = parts[0].toUpperCase(); 
            for (let i = parts.length - 1; i >= 1; i--) {
                let parsed = parseInt(parts[i]);
                if (!isNaN(parsed)) { jpy = parsed; break; }
            }
        } else { 
            // 只有輸入數字，或是無法辨識為文字，就採用自動分配的代碼
            code = autoCode;
            jpy = parseInt(parts[0]) || 0; 
        }

        if (jpy <= 0) return alert("⚠️ 請輸入有效的日幣金額！");
        let twd = calculateTWD(jpy);
        badgeHistory.push({ x, y, code, jpy, twd, cw, ch });
        redrawCanvas();
    }

    function triggerDoubleTap(pos) {
        for (let i = badgeHistory.length - 1; i >= 0; i--) {
            let box = getBadgeHitbox(badgeHistory[i]);
            if (pos.x >= box.left && pos.x <= box.right && pos.y >= box.top && pos.y <= box.bottom) {
                let b = badgeHistory[i];
                setTimeout(() => {
                    // 雙擊修改時預設僅需修改日幣，但可透過「新代碼 日幣」強制覆蓋
                    let input = prompt(`✏️ 請修改【日幣價格】\n(目前代碼：${b.code}，若要連代碼一起改，請輸入: 新代碼 日幣)`, b.jpy);
                    if (input) {
                        let code = b.code, jpy = 0;
                        let parts = input.trim().replace(/\s+/g, ' ').split(' ');
                        if (parts.length > 1 && isNaN(parseInt(parts[0]))) { 
                            code = parts[0].toUpperCase(); 
                            for (let k = parts.length - 1; k >= 1; k--) {
                                if (!isNaN(parseInt(parts[k]))) { jpy = parseInt(parts[k]); break; }
                            }
                        } else { 
                            jpy = parseInt(parts[0]) || 0; 
                        }
                        if (jpy > 0) { b.code = code; b.jpy = jpy; b.twd = calculateTWD(jpy); redrawCanvas(); }
                    }
                }, 50);
                return true; 
            }
        }
        return false;
    }

    function handlePointerDown(e) {
        if (!img.src) return;
        let currentTime = new Date().getTime();
        let tapLength = currentTime - lastTapTime;
        const pos = getPointerPos(e);

        if (tapLength < 300 && tapLength > 0) {
            if (triggerDoubleTap(pos)) { e.preventDefault(); return; }
        }
        lastTapTime = currentTime;
        startX = pos.x; startY = pos.y; isClick = true;

        for (let i = badgeHistory.length - 1; i >= 0; i--) {
            let box = getBadgeHitbox(badgeHistory[i]);
            if (pos.x >= box.left && pos.x <= box.right && pos.y >= box.top && pos.y <= box.bottom) {
                isDragging = true; dragTargetIndex = i; 
                dragOffsetX = pos.x - badgeHistory[i].x; dragOffsetY = pos.y - badgeHistory[i].y;
                return;
            }
        }

        if (currentMode === 'cover') { isDrawingBox = true; boxCurrentX = pos.x; boxCurrentY = pos.y; }
    }

    function handlePointerMove(e) {
        if (!img.src) return;
        if (isDragging || isDrawingBox) { e.preventDefault(); }
        const pos = getPointerPos(e);
        
        if (isDragging && dragTargetIndex !== -1) {
            isClick = false; 
            badgeHistory[dragTargetIndex].x = pos.x - dragOffsetX; 
            badgeHistory[dragTargetIndex].y = pos.y - dragOffsetY; 
            redrawCanvas();
        } 
        else if (isDrawingBox) {
            isClick = false; boxCurrentX = pos.x; boxCurrentY = pos.y; redrawCanvas();
            ctx.save();
            ctx.strokeStyle = "#e53e3e"; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
            ctx.strokeRect(startX, startY, boxCurrentX - startX, boxCurrentY - startY);
            ctx.fillStyle = "rgba(229, 62, 62, 0.2)";
            ctx.fillRect(startX, startY, boxCurrentX - startX, boxCurrentY - startY);
            ctx.restore();
        } else {
            if (Math.abs(pos.x - startX) > 5 || Math.abs(pos.y - startY) > 5) isClick = false; 
        }
    }

    function handlePointerUp(e) {
        if (!img.src) return;
        if (isDragging) { isDragging = false; dragTargetIndex = -1; } 
        else if (isDrawingBox) {
            isDrawingBox = false;
            let w = Math.abs(boxCurrentX - startX); let h = Math.abs(boxCurrentY - startY);
            let cx = Math.min(startX, boxCurrentX) + w / 2; let cy = Math.min(startY, boxCurrentY) + h / 2;
            
            if (w > 20 && h > 20) {
                setTimeout(() => {
                    let autoCode = getNextAvailableCode();
                    let input = prompt(`📍 自動配發代碼：【${autoCode}】\n💰 請輸入「日幣價格」：\n(若要自訂代碼，請輸入: 代碼 價格)`);
                    if (input) parseAndAddBadge(input, cx, cy, autoCode, w, h);
                    else redrawCanvas();
                }, 50);
            } else {
                redrawCanvas();
                if (isClick) {
                    setTimeout(() => {
                        let autoCode = getNextAvailableCode();
                        let input = prompt(`📍 自動配發代碼：【${autoCode}】\n💰 請輸入「日幣價格」：\n(若要自訂代碼，請輸入: 代碼 價格)`);
                        parseAndAddBadge(input, startX, startY, autoCode);
                    }, 50);
                }
            }
        } 
        else if (isClick && currentMode === 'click') {
            setTimeout(() => {
                let autoCode = getNextAvailableCode();
                let input = prompt(`📍 自動配發代碼：【${autoCode}】\n💰 請輸入「日幣價格」：\n(若要自訂代碼，請輸入: 代碼 價格)`);
                parseAndAddBadge(input, startX, startY, autoCode);
            }, 50);
        }
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', handlePointerMove);
    canvas.addEventListener('mouseup', handlePointerUp);
    canvas.addEventListener('mouseleave', function() {
        if (isDragging) { isDragging = false; dragTargetIndex = -1; }
        if (isDrawingBox) { isDrawingBox = false; redrawCanvas(); }
    });
    canvas.addEventListener('dblclick', function(e) { triggerDoubleTap(getPointerPos(e)); });

    canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
    canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
    canvas.addEventListener('touchend', handlePointerUp);
    canvas.addEventListener('touchcancel', function() {
        if (isDragging) { isDragging = false; dragTargetIndex = -1; }
        if (isDrawingBox) { isDrawingBox = false; redrawCanvas(); }
    });

    function redrawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height); 
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height); 
        badgeHistory.forEach(b => { drawPriceBadge(b.x, b.y, b.code, b.jpy, b.twd, b.cw, b.ch); });
    }

    function drawHeart(ctx, x, y, size, rotationDeg = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotationDeg * Math.PI / 180);
        ctx.scale(size/100, size/100);
        ctx.beginPath();
        ctx.moveTo(50, 30);
        ctx.bezierCurveTo(50, -10, 0, -10, 0, 30);
        ctx.bezierCurveTo(0, 60, 50, 85, 50, 100);
        ctx.bezierCurveTo(50, 85, 100, 60, 100, 30);
        ctx.bezierCurveTo(100, -10, 50, -10, 50, 30);
        ctx.fillStyle = "#b73229"; 
        ctx.fill();
        ctx.restore();
    }

    function drawPaw(ctx, x, y, size, rotationDeg = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotationDeg * Math.PI / 180);
        ctx.scale(size/100, size/100);
        ctx.fillStyle = "#5c4033"; 
        ctx.beginPath(); ctx.ellipse(50, 70, 22, 18, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(25, 45, 10, 14, -Math.PI/6, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(40, 25, 10, 14, -Math.PI/12, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(60, 25, 10, 14, Math.PI/12, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(75, 45, 10, 14, Math.PI/6, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }

    function drawPriceBadge(x, y, code, jpy, twd, cw = 0, ch = 0) {
        ctx.save();
        let text = code ? `${code} NT$${twd}` : `NT$${twd}`;
        let subText = `(¥${jpy})`;
        let sf = document.getElementById('size-slider').value;
        let fontSize = Math.max(14, Math.round((canvas.width / 1000) * sf * 1.5));
        let subFontSize = Math.round(fontSize * 0.75);
        let fontStack = "'Comic Sans MS', 'Chalkboard SE', 'Fredoka One', 'Marker Felt', sans-serif";
        
        ctx.font = `bold ${fontSize}px ${fontStack}`;
        let textWidth = ctx.measureText(text).width;
        ctx.font = `bold ${subFontSize}px ${fontStack}`;
        let subWidth = ctx.measureText(subText).width;
        
        let paddingX = fontSize * 1.5; 
        let paddingY = fontSize * 1.0;
        let contentWidth = Math.max(textWidth, subWidth) + paddingX * 2.2; 
        let contentHeight = fontSize + subFontSize + paddingY * 1.8;
        
        let finalBoxWidth = Math.max(contentWidth, cw);
        let finalBoxHeight = Math.max(contentHeight, ch);
        
        let left = x - finalBoxWidth / 2;
        let top = y - finalBoxHeight / 2;

        let holeX = left + finalBoxWidth - fontSize * 1.2;
        let holeY = top + finalBoxHeight / 2;
        let eyeletRadius = fontSize * 0.35;

        ctx.beginPath();
        ctx.moveTo(holeX, holeY - eyeletRadius);
        ctx.bezierCurveTo(holeX + fontSize*3, holeY - fontSize*1.5, holeX + fontSize*4, holeY + fontSize*0.5, holeX, holeY + eyeletRadius);
        ctx.lineWidth = Math.max(3, fontSize * 0.2);
        ctx.strokeStyle = "#c0a887"; 
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(holeX, holeY - eyeletRadius);
        ctx.bezierCurveTo(holeX + fontSize*3, holeY - fontSize*1.5, holeX + fontSize*4, holeY + fontSize*0.5, holeX, holeY + eyeletRadius);
        ctx.lineWidth = Math.max(3, fontSize * 0.2);
        ctx.strokeStyle = "#7a5c40"; 
        ctx.setLineDash([fontSize * 0.3, fontSize * 0.3]);
        ctx.stroke();
        ctx.setLineDash([]); 

        ctx.shadowColor = "rgba(0, 0, 0, 0.4)"; 
        ctx.shadowBlur = fontSize * 0.4;
        ctx.shadowOffsetY = fontSize * 0.2;
        ctx.fillStyle = "#d3b38c"; 

        ctx.beginPath();
        let sX = finalBoxWidth / 8;
        let sY = finalBoxHeight / 5;
        let v = fontSize * 0.1; 
        
        ctx.moveTo(left, top);
        ctx.lineTo(left + sX*1, top + v); ctx.lineTo(left + sX*2, top - v);
        ctx.lineTo(left + sX*3, top + v); ctx.lineTo(left + sX*4, top - v);
        ctx.lineTo(left + sX*5, top + v); ctx.lineTo(left + sX*6, top - v);
        ctx.lineTo(left + sX*7, top + v); ctx.lineTo(left + finalBoxWidth, top);
        
        ctx.lineTo(left + finalBoxWidth - v, top + sY*1); ctx.lineTo(left + finalBoxWidth + v, top + sY*2);
        ctx.lineTo(left + finalBoxWidth - v, top + sY*3); ctx.lineTo(left + finalBoxWidth + v, top + sY*4);
        ctx.lineTo(left + finalBoxWidth, top + finalBoxHeight);
        
        ctx.lineTo(left + sX*7, top + finalBoxHeight - v); ctx.lineTo(left + sX*6, top + finalBoxHeight + v);
        ctx.lineTo(left + sX*5, top + finalBoxHeight - v); ctx.lineTo(left + sX*4, top + finalBoxHeight + v);
        ctx.lineTo(left + sX*3, top + finalBoxHeight - v); ctx.lineTo(left + sX*2, top + finalBoxHeight + v);
        ctx.lineTo(left + sX*1, top + finalBoxHeight - v); ctx.lineTo(left, top + finalBoxHeight);
        
        ctx.lineTo(left + v, top + sY*4); ctx.lineTo(left - v, top + sY*3);
        ctx.lineTo(left + v, top + sY*2); ctx.lineTo(left - v, top + sY*1);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.strokeStyle = "rgba(92, 64, 51, 0.2)";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(holeX, holeY, eyeletRadius * 1.6, 0, Math.PI * 2);
        ctx.fillStyle = "#c2a478";
        ctx.fill();
        ctx.lineWidth = Math.max(1, fontSize * 0.05);
        ctx.strokeStyle = "#8b7152";
        ctx.stroke();
        
        ctx.save();
        ctx.beginPath();
        ctx.arc(holeX, holeY, eyeletRadius, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.restore();
        
        ctx.beginPath();
        ctx.arc(holeX, holeY, eyeletRadius, 0, Math.PI * 2);
        ctx.lineWidth = Math.max(1, fontSize * 0.1);
        ctx.strokeStyle = "rgba(0,0,0,0.3)";
        ctx.stroke();

        drawHeart(ctx, holeX - fontSize * 1.3, holeY - fontSize * 0.3, fontSize * 0.35, -15);
        drawPaw(ctx, holeX - fontSize * 0.9, holeY + fontSize * 0.6, fontSize * 0.5, -20);
        drawPaw(ctx, holeX - fontSize * 0.2, holeY + fontSize * 0.9, fontSize * 0.4, 15);

        let textStartX = left + (finalBoxWidth - fontSize * 1.2) / 2;
        let textStartY = top + paddingY * 1.1;
        
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillStyle = "#462e1b"; 
        
        ctx.font = `bold ${fontSize}px ${fontStack}`;
        ctx.fillText(text, textStartX, textStartY);
        
        ctx.font = `bold ${subFontSize}px ${fontStack}`;
        ctx.fillText(subText, textStartX, textStartY + fontSize * 1.2);

        ctx.restore();
    }

    async function syncAllToBackend(btn) {
        let validBadges = badgeHistory.filter(b => b.code !== "");
        if (validBadges.length === 0) return showToast("⚠️ 目前沒有含有代碼的標籤可以同步！");

        let originalBtnText = btn.innerText;
        btn.innerText = "⏳ 上傳照片中...";
        btn.disabled = true; 
        let successCount = 0;
        let imgUrl = "";

        try {
            try {
                let base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
                let formData = new FormData();
                formData.append("image", base64Image);
                
                let imgbbRes = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, {
                    method: "POST",
                    body: formData
                });
                let imgbbData = await imgbbRes.json();
                if (imgbbData.success) {
                    imgUrl = imgbbData.data.url; 
                } else {
                    console.error("照片上傳 ImgBB 失敗:", imgbbData);
                }
            } catch(e) {
                console.error("照片上傳例外錯誤:", e);
                showToast("⚠️ 照片上傳失敗，將僅同步價格");
            }

            btn.innerText = "⏳ 寫入雲端中...";

            for (let b of validBadges) {
                try {
                    let res = await fetch(GAS_URL, { 
                        method: "POST", 
                        body: JSON.stringify({ 
                            action: "syncPriceFromTool", 
                            productCode: b.code, 
                            newPrice: b.twd,
                            imgUrl: imgUrl 
                        }) 
                    });
                    if(await res.text() === "success") {
                        successCount++;
                        usedCodes.add(String(b.code).toUpperCase()); // 同步成功後加入本地的已使用名單
                    }
                } catch (err) {
                    console.error("單筆同步失敗:", err);
                }
            }
            
            if(successCount > 0) showToast(`✅ 同步完成！照片與 ${successCount} 筆商品已更新。`);
            else showToast(`❌ 同步失敗，請檢查網路連線。`);
        } finally {
            btn.innerText = originalBtnText;
            btn.disabled = false;
        }
    }

    function copyImageToClipboard() {
        if (!img.src) return alert("請先選擇照片！");
        
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85); 
        
        if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
            try {
                fetch(dataUrl).then(res => res.blob()).then(blob => {
                    const file = new File([blob], `標價圖_${new Date().getTime()}.jpg`, { type: 'image/jpeg' });
                    navigator.share({ title: '連線商品標價圖', files: [file] });
                    closeExportModal();
                });
                return; 
            } catch (err) {}
        }
        
        let resultImg = document.getElementById('export-image-result');
        resultImg.src = dataUrl;
        document.getElementById('image-export-modal').style.display = 'flex';
    }

    function closeExportModal() {
        document.getElementById('image-export-modal').style.display = 'none';
    }

    function showToast(msg) {
        let toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function undoLastBadge() { if (badgeHistory.length > 0) { badgeHistory.pop(); redrawCanvas(); } }
    
    function downloadImage() {
        if (!img.src) return alert("請先選擇照片！");
        
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        
        if (isMobile && navigator.share) {
            fetch(dataUrl).then(res => res.blob()).then(blob => {
                const file = new File([blob], `標價圖_${new Date().getTime()}.jpg`, { type: 'image/jpeg' });
                navigator.share({ title: '儲存標價圖', files: [file] }).catch(() => {
                    let resultImg = document.getElementById('export-image-result');
                    resultImg.src = dataUrl;
                    document.getElementById('image-export-modal').style.display = 'flex';
                });
            }).catch(() => {
                let resultImg = document.getElementById('export-image-result');
                resultImg.src = dataUrl;
                document.getElementById('image-export-modal').style.display = 'flex';
            });
        } else {
            try {
                let link = document.createElement('a');
                link.download = `標價圖_${new Date().getTime()}.jpg`; 
                link.href = dataUrl; 
                document.body.appendChild(link); 
                link.click();
                document.body.removeChild(link);
            } catch (err) {
                let resultImg = document.getElementById('export-image-result');
                resultImg.src = dataUrl;
                document.getElementById('image-export-modal').style.display = 'flex';
            }
        }
    }
</script>
